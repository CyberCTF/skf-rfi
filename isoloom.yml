# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Remote File Inclusion (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask page that downloads a script from a URL and runs it with eval() (remote file inclusion). The SKF lab folder python/RFI is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-rfi

networks:
  lab: { cidr: 10.60.142.0/24, internet: true }  # the exploit makes the server fetch a file the player hosts

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the command form posts a filename to /cmd
    script: checks/form.sh

message: |
  OWASP SKF Remote File Inclusion answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Each command is a file the server downloads and evaluates. Does it have to come from the server itself?
